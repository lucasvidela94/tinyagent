name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install mingw-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64
      - name: static checks, host tests (ASan/UBSan), Win32 cross-build, exe budget
        run: bash scripts/check.sh --build
      - name: only system DLLs (no UCRT)
        run: |
          DLLS=$(i686-w64-mingw32-objdump -p tinyshell.exe | awk '/DLL Name/{print $3}')
          echo "$DLLS"
          ! echo "$DLLS" | grep -qi 'api-ms-win-crt'
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fuzz JSON and SSE parsers (60 s each)
        run: bash build/fuzz.sh 60
