name: Bug report
description: Something in TinyShell does not work.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. The more concrete it is, the faster it gets fixed. (Spanish is fine too.)
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `tinyshell --version`.
      placeholder: "0.7.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS (Windows version or distro and kernel), 32/64-bit, provider and model.
      placeholder: "Windows 7 SP1 32-bit, opencode-go, deepseek-v4.1-flash"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: "That it lists the startup programs."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      placeholder: "Paste the full error and the proposed command."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Extra information
      description: Logs, screenshots or the output of scripts/collect-diagnostics.bat.
