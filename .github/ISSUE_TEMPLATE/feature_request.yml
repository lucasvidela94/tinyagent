name: Feature request
description: Pedir una mejora o proponer una idea.
title: "[idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Contá el problema antes que la solución: ¿qué querés lograr en tu PC vieja?"
  - type: textarea
    id: problem
    attributes:
      label: Problema
      placeholder: "En mi netbook con 2 GB no puedo..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta
      placeholder: "Que TinyShell haga X de esta forma..."
    validations:
      required: true
  - type: textarea
    id: alt
    attributes:
      label: Alternativas que probaste
      placeholder: "Hoy lo resuelvo con..."
  - type: dropdown
    id: scope
    attributes:
      label: Alcance estimado
      options:
        - No sé
        - Solo docs/mensajes
        - Cambio chico de código
        - Cambio grande (nuevo módulo, red, ejecución)
