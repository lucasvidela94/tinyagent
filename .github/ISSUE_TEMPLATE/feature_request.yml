name: Feature request
description: Ask for an improvement or propose an idea.
title: "[idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Describe the problem before the solution: what do you want to get done on your old PC?"
  - type: textarea
    id: problem
    attributes:
      label: Problem
      placeholder: "On my 2 GB netbook I cannot..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      placeholder: "TinyShell could do X like this..."
    validations:
      required: true
  - type: textarea
    id: alt
    attributes:
      label: Alternatives you tried
      placeholder: "Today I work around it with..."
  - type: dropdown
    id: scope
    attributes:
      label: Estimated scope
      options:
        - Not sure
        - Docs or messages only
        - Small code change
        - Large change (new module, networking, execution)
